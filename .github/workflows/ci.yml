name: CI

# Run on pushes to the default branch, on every pull request, on merge-queue
# entries, on demand, and on a weekly schedule. Feature branches get their
# coverage through the PR they open; `workflow_dispatch` lets you kick a run
# manually from any branch. The schedule exists chiefly for the cargo-deny
# advisories check: without it, a new RUSTSEC advisory against a pinned
# dependency surfaces only when the next unrelated PR happens to run CI —
# and then blocks that PR for a problem its author didn't cause.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# The workflow only ever reads the repository: every job checks out, builds,
# tests, or lints; nothing pushes, comments, or releases (Codecov uploads via
# its own token, not GITHUB_TOKEN). Locking the token to read-only bounds the
# blast radius of a compromised third-party action.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the
# in-flight run for that PR). The default branch is exempted from the group so
# post-merge runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Native x86-64 Linux: the primary matrix. Every (toolchain × features ×
  # profile) combination is built and its full test suite (unit + doctests +
  # the fork+exec daemon e2e tests + the trybuild macro-UI snapshots) run.
  #
  # Toolchains are exactly stable / nightly / MSRV: the macro-UI compile-fail
  # snapshots are `rustversion`-gated to current stable only, so this trio is
  # what tests/macro_ui.rs is written against. `1.90` is the workspace
  # `rust-version` (chosen for std's documented MSG_NOSIGNAL on UnixStream
  # writes — see the rust-version comment in Cargo.toml); keep the two in
  # sync, along with the snapshot gate in tests/macro_ui.rs.
  # ---------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.toolchain }} / ${{ matrix.features || 'default' }} / ${{ matrix.profile || 'debug' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "nightly", "1.90"]
        features: ["", "--no-default-features", "--all-features"]
        profile: ["", "--release"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}-${{ matrix.profile }}
      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.features }} ${{ matrix.profile }}
      - name: Test
        run: cargo test --workspace ${{ matrix.features }} ${{ matrix.profile }}

  # ---------------------------------------------------------------------------
  # Per-crate check: `cargo check` each workspace crate on its own, across
  # every feature set. The `test` job builds the whole workspace, where Cargo
  # unifies features — so a crate that only compiles because a sibling turned a
  # feature on still passes there. Checking each crate in isolation catches
  # that, which matters here because `daemonizable` is meant to stay lib-only
  # and publishable with a minimal feature surface.
  # ---------------------------------------------------------------------------
  check-crates:
    name: check / ${{ matrix.crate }} / ${{ matrix.features || 'default' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          [
            "daemonizable",
            "daemonizable-macros",
            "daemonizable-e2e-tests",
            "daemonizable-rename-test",
          ]
        features: ["", "--no-default-features", "--all-features"]
        include:
          # testutils WITHOUT macros: the exact configuration a downstream
          # crate uses to unit-test its IPC wiring without the proc-macro
          # stack (default-features = false, features = ["testutils"]). With
          # only two features, --all-features == default+testutils, so this is
          # the one reachable combination the base matrix misses — and only
          # this leg would catch a testutils item accidentally referencing the
          # macros re-export.
          - crate: "daemonizable"
            features: "--no-default-features --features testutils"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.crate }}-${{ matrix.features }}
      - run: cargo check -p ${{ matrix.crate }} --all-targets ${{ matrix.features }}
      # `--all-targets` does not build doctests, and the workspace `test` job
      # can't cover them per-feature either (feature unification again:
      # `daemonizable-e2e-tests` depends on `daemonizable` with default features,
      # so `macros` is on even in that job's --no-default-features leg). This is
      # therefore the only place the crate's doctests — e.g. the `no_run`
      # doctest on `run` — are compiled in each feature configuration,
      # including with `macros` genuinely off. Skipped for the bin-only
      # rename-test crate: `cargo test --doc` hard-errors ("no library
      # targets") on a package without a lib target.
      - run: cargo test -p ${{ matrix.crate }} --doc ${{ matrix.features }}
        if: matrix.crate != 'daemonizable-rename-test'

  # ---------------------------------------------------------------------------
  # Minimal-versions: resolve every dependency to the lowest version its
  # requirement allows and make sure the workspace still builds and tests. This
  # catches version constraints in Cargo.toml that are actually too loose.
  # Requires nightly for `-Z direct-minimal-versions`.
  # ---------------------------------------------------------------------------
  minimal-versions:
    name: minimal-versions / ${{ matrix.features || 'default' }} / ${{ matrix.profile || 'debug' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features", "--all-features"]
        profile: ["", "--release"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-${{ matrix.features }}-${{ matrix.profile }}
      - name: Pin dependencies to their minimal versions
        run: cargo update -Z direct-minimal-versions
      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.features }} ${{ matrix.profile }}
      - name: Test
        run: cargo test --workspace ${{ matrix.features }} ${{ matrix.profile }}

  # ---------------------------------------------------------------------------
  # Native macOS: exercises the non-Linux code path. On Linux the re-exec spawn
  # hands `/proc/self/exe` to execve; everywhere else it falls back to
  # `std::env::current_exe()` (see ipc/spawn/process.rs). This job is the only
  # thing that compiles and runs that fallback plus the Unix IPC/signal plumbing
  # against a BSD-flavoured libc.
  # ---------------------------------------------------------------------------
  macos:
    name: test / macos / ${{ matrix.features || 'default' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.features }}
      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.features }}
      - name: Test
        run: cargo test --workspace ${{ matrix.features }}

  # ---------------------------------------------------------------------------
  # Linter: clippy over every feature combination and all targets, warnings
  # promoted to errors. Running each feature set (not just --all-features)
  # means feature-gated code — the `macros` re-export and the `testutils`
  # helpers — gets linted in the configurations it actually ships in.
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy / ${{ matrix.features || 'default' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  # ---------------------------------------------------------------------------
  # Formatting: rustfmt in check mode.
  # ---------------------------------------------------------------------------
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Documentation: build the docs with intra-doc-link and other rustdoc
  # warnings treated as errors, so dead links and broken doc examples fail CI.
  #
  # Also verify README.md is in sync with the crate docs. The crate-root docs in
  # crates/daemonizable/src/lib.rs are the single source of truth; cargo-rdme
  # generates crates/daemonizable/README.md (the repo-root README.md is a
  # symlink to it) between the `<!-- cargo-rdme -->` markers, rewriting the
  # crate's intra-doc links (`[`Type`]`) into docs.rs URLs. `cargo rdme --check`
  # (config in .cargo-rdme.toml) exits non-zero if the committed README no longer
  # matches the docs, i.e. someone edited lib.rs without running `cargo rdme`.
  #
  # NOTE: the crate itself only ever builds on stable. cargo-rdme uses a pinned
  # nightly toolchain SOLELY to run rustdoc's JSON output when resolving those
  # intra-doc links; that nightly never compiles or tests daemonizable. Both the
  # cargo-rdme version and its nightly are pinned so the generated README (and
  # therefore --check) stays reproducible.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
      - name: Install cargo-rdme
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-rdme@2.1.0
      - name: Install cargo-rdme's pinned nightly (for intra-doc link resolution only)
        run: cargo rdme install-rust-toolchain-for-intralinks
      - name: Check README is in sync with the crate docs
        run: cargo rdme --check

  # ---------------------------------------------------------------------------
  # Semver: compare the public API of the publishable crates against the last
  # release on crates.io and flag accidental breaking changes. Crates that are
  # `publish = false` (the e2e-tests and rename-test crates) are ignored.
  #
  # The crates have been published since 2026-07-11, so this job diffs against
  # a real baseline (the latest release) and is a genuine gate: a red run here
  # is an accidental breaking change that must be fixed or accompanied by the
  # matching version bump — never shrugged off.
  # ---------------------------------------------------------------------------
  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # ---------------------------------------------------------------------------
  # Supply chain: cargo-deny checks the dependency tree for security
  # advisories, disallowed / unknown licenses, banned or wildcard-pinned
  # crates, and dependencies from unexpected sources. Config lives in
  # deny.toml at the repo root.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ---------------------------------------------------------------------------
  # Coverage: instrument and run the whole workspace with cargo-llvm-cov and
  # upload the LCOV report to Codecov. `CODECOV_TOKEN` is optional for public
  # repositories; the upload is non-blocking so Codecov hiccups never turn CI
  # red.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  # ---------------------------------------------------------------------------
  # Aggregate gate: a single job that succeeds only if every other job did.
  # Point branch protection at "CI success" instead of enumerating the whole
  # matrix, whose job names change whenever the matrix does.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI success
    if: always()
    needs:
      - test
      - check-crates
      - minimal-versions
      - macos
      - clippy
      - rustfmt
      - docs
      - semver-checks
      - cargo-deny
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All checks passed
        run: echo "All CI jobs succeeded."

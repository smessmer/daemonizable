[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Sebastian Messmer <messmer@cryfs.org>"]
edition = "2024"
repository = "https://github.com/smessmer/daemonizable"
license = "MIT OR Apache-2.0"
# 1.90, not edition 2024's 1.85 floor: since Rust 1.90, std documents that
# `UnixStream` writes carry `MSG_NOSIGNAL`, which makes the channel's
# dead-peer-send guarantee (`ChannelSendError::Io(BrokenPipe)`, never a fatal
# SIGPIPE) unconditional on Linux — independent of the process's SIGPIPE
# disposition. On 1.85–1.89 that guarantee held only under Rust's default
# process-wide SIGPIPE ignore, which daemons commonly reset. Keep in sync
# with the CI MSRV leg and the macro-UI snapshot gate.
rust-version = "1.90"
version = "0.0.3"

# Every member crate opts in with `[lints] workspace = true`. Note that the
# table only reaches a crate's own targets — each file under `tests/` and
# `src/bin/` is its own crate root but still belongs to the package, so these
# lints do cover the e2e helper binaries and integration tests.
[workspace.lints.rust]
# Edition 2024 only *warns* on an unsafe operation that isn't wrapped in its
# own `unsafe {}` block inside an `unsafe fn`. Every unsafe op in this
# workspace is already wrapped and individually justified; deny locks that in
# so an unsafe fn body can't silently absorb new unsafe operations.
unsafe_op_in_unsafe_fn = "deny"
# Every public type carries a Debug impl (manual where a derive would leak
# `T: Debug` bounds through PhantomData — see the RPC endpoint types). Warn so
# a new public type can't silently ship without one.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Every `unsafe {}` block in this workspace carries a `// SAFETY:` comment
# arguing why the contract of the called function is satisfied. Keep it that
# way.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
command-fds = "^0.3.0"
# Internal companion crate. Declared here (like every other dependency) so its
# path + published version requirement live in one place; consuming crates just
# say `daemonizable-macros = { workspace = true }`. The `version` must match the
# workspace `version` above on release — keep the two in sync (or bump both via
# a release tool such as `cargo-release` / `release-plz`).
daemonizable-macros = { path = "crates/daemonizable-macros", version = "0.0.3" }
libc = "^0.2.182"
nix = "^0.31.2"
postcard = { version = "^1.0.0", default-features = false }
proc-macro2 = "^1.0.83"
quote = "^1.0.35"
rustversion = "^1.0.20"
serde = "^1.0.194"
syn = "^2.0.87"
tempfile = "^3.27"
thiserror = "^2.0.0"
trybuild = "^1.0.105"
